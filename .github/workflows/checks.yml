name: Validate toolkit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n examples/matrix/job.pbs .github/run_test_pipeline.sh .github/run_wandb_smoke.sh .github/sync_wandb.sh
      - run: git diff --check
